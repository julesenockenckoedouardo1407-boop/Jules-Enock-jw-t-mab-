<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jules Enock Lestekè — Jwèt Mab</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10200f;font-family:Arial,sans-serif;color:#fff;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:radial-gradient(circle,#6b7d42 0,#263b20 52%,#101a0d 100%)}
#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;pointer-events:none;z-index:4}
.badge{background:#111cdd;color:#fff;padding:7px 10px;border-radius:12px;font-weight:bold;box-shadow:0 2px 8px #0008;font-size:13px}.badge.best{background:#8a5a00}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,560px);text-align:center;background:#000b;padding:11px 14px;border-radius:14px;font-weight:bold;line-height:1.35;pointer-events:none}
#power{position:fixed;left:50%;top:62px;transform:translateX(-50%);width:min(70vw,330px);height:13px;border:2px solid #fff;border-radius:20px;overflow:hidden;background:#0008;display:none}
#power i{display:block;height:100%;width:0%;background:#ffd400}
#soundBtn{position:fixed;left:12px;bottom:76px;border:0;border-radius:14px;width:44px;height:42px;background:#111cdd;color:#fff;font-size:20px;box-shadow:0 2px 8px #0008;z-index:5}
#restart{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;border:0;border-radius:16px;padding:13px 20px;background:#ffd400;color:#111;font-size:18px;font-weight:900}
#aboutBtn{position:fixed;right:12px;bottom:76px;border:0;border-radius:14px;padding:10px 13px;background:#111cdd;color:#fff;font-size:13px;font-weight:900;box-shadow:0 2px 8px #0008;z-index:5}
#aboutModal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#aboutModal[hidden]{display:none}
#aboutCard{position:relative;width:min(88vw,390px);box-sizing:border-box;background:#173014;border:3px solid #d8c18b;border-radius:24px;padding:28px 22px 22px;text-align:center;box-shadow:0 10px 35px #000b}
#aboutCard h2{margin:5px 0 3px;color:#ffd400;font-size:24px}
#aboutCard h3{margin:0 0 15px;font-size:21px}
#aboutCard p{margin:9px 0;line-height:1.4}
#aboutCard .offline{color:#ffd400;font-weight:bold}
.aboutIcon{font-size:42px}
#aboutClose{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;font-size:32px;line-height:1;padding:4px 10px}
#aboutOk{margin-top:14px;border:0;border-radius:14px;padding:11px 22px;background:#ffd400;color:#111;font-weight:900;font-size:15px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
 <div class="badge">Billes: <span id="left">10</span></div>
 <div class="badge">Gagnées: <span id="won">0</span></div>
 <div class="badge">Tirs: <span id="shots">0</span></div>
 <div class="badge">Score: <span id="score">0</span></div>
 <div class="badge best">Record: <span id="best">0</span></div>
</div>
<div id="power"><i></i></div>
<div id="msg">⚪ Place la bille blanche autour du cercle.</div>
<button id="restart">REJOUER</button>
<button id="soundBtn" aria-label="Son">🔊</button>
<button id="aboutBtn" aria-label="À propos">À PROPOS</button>
<div id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
  <div id="aboutCard">
    <button id="aboutClose" aria-label="Fermer">×</button>
    <div class="aboutIcon">🎯</div>
    <h2 id="aboutTitle">Jules Enock Lestekè</h2>
    <h3>Jwèt Mab</h3>
    <p>Un jeu de billes simple, inspiré du jeu de mab.</p>
    <p><strong>Version :</strong> 1.1.0</p>
    <p><strong>Créé par :</strong> Jules Enock Lestekè</p>
    <p class="offline">📴 Fonctionne hors connexion.</p>
    <button id="aboutOk">FERMER</button>
  </div>
</div>

<script>
"use strict";
const C=document.getElementById("game"),ctx=C.getContext("2d");
const leftEl=document.getElementById("left"),wonEl=document.getElementById("won"),
shotsEl=document.getElementById("shots"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),soundBtn=document.getElementById("soundBtn");
const msg=document.getElementById("msg"),powerBox=document.getElementById("power"),powerFill=powerBox.firstElementChild,restart=document.getElementById("restart");

let W,H,cx,cy,R,dpr=1;
let shooter,balls,phase,score,shots,won,aim,place,settleTimer,shotId=0,combo=0,particles=[],shake=0;
let bestScore=Number(localStorage.getItem("jwetMabBest")||0);
let audioCtx=null,soundOn=localStorage.getItem("jwetMabSound")!=="off";
bestEl.textContent=bestScore;soundBtn.textContent=soundOn?"🔊":"🔇";
function tone(freq=440,duration=.05,type="sine",gain=.035){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(e){}}
function burst(x,y,color,count=8){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color})}}
function updateParticles(){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=.035}particles=particles.filter(p=>p.life>0);if(shake>0)shake*=.86;if(shake<.2)shake=0}

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
 C.width=W*dpr;C.height=H*dpr;C.style.width=W+"px";C.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0); cx=W/2;cy=H/2+20;R=Math.min(W,H)*.30;
 if(phase==="place"||phase==="intro") placeShooter(shooter.angle);
}
addEventListener("resize",resize);

function ball(x,y,r,color){
 return {x,y,r,vx:0,vy:0,color,active:true,id:Math.random()};
}
function placeShooter(a){
 shooter.angle=a;
 shooter.x=cx+Math.cos(a)*(R+shooter.r+28);
 shooter.y=cy+Math.sin(a)*(R+shooter.r+28);
 shooter.vx=shooter.vy=0;
}
function newGame(){
 score=0;shots=0;won=0;shotId=0;combo=0;particles=[];shake=0;phase="place";aim=null;place=null;settleTimer=0;
 shooter=ball(0,0,14,"white"); shooter.angle=-Math.PI/2;
 placeShooter(shooter.angle);
 const p=[[-.52,-.12],[-.27,-.34],[0,-.35],[.27,-.34],[.52,-.12],
 [-.40,.14],[-.14,.08],[.15,.08],[.40,.14],[0,.34]];
 balls=p.map((q,i)=>ball(cx+q[0]*R,cy+q[1]*R,13,["#ff4040","#ffd22e","#42a5ff","#ff70c8","#ff8a35","#73e06f","#b58cff","#fff","#43d6d1","#ff9a42"][i]));
 restart.style.display="none"; powerBox.style.display="none";
 setMsg("⚪ Déplace la bille blanche autour du cercle pour choisir ton angle.");
 updateUI();
}
function setMsg(t){msg.textContent=t}
function updateUI(){
 leftEl.textContent=balls.filter(b=>b.active).length;
 wonEl.textContent=won;shotsEl.textContent=shots;scoreEl.textContent=score;bestEl.textContent=Math.max(bestScore,score);
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pointer(e){
 const r=C.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function nearShooter(p){return Math.hypot(p.x-shooter.x,p.y-shooter.y)<34}

C.addEventListener("pointerdown",e=>{
 e.preventDefault(); C.setPointerCapture(e.pointerId); const p=pointer(e);
 if(phase==="place"){
   if(nearShooter(p)){place={startAngle:Math.atan2(p.y-cy,p.x-cx)}; setMsg("↔ Fais glisser autour du cercle pour placer la bille.");}
 }else if(phase==="ready"){
   if(nearShooter(p)){
     aim={startX:p.x,startY:p.y,x:p.x,y:p.y};
     powerBox.style.display="block"; setMsg("⬇ Tire la bille vers l'intérieur pour charger la puissance, puis relâche.");
   }
 }else if(phase==="over"){}
});
C.addEventListener("pointermove",e=>{
 e.preventDefault(); const p=pointer(e);
 if(phase==="place" && place){
   const a=Math.atan2(p.y-cy,p.x-cx); placeShooter(a);
 }else if(phase==="ready" && aim){
   aim.x=p.x;aim.y=p.y;
   const pull=Math.hypot(shooter.x-p.x,shooter.y-p.y);
   const pct=Math.max(0,Math.min(100,(pull-5)/Math.max(30,R*.65)*100));
   powerFill.style.width=pct+"%";
   setMsg("Puissance : "+Math.round(pct)+"% — relâche pour tirer vers l'intérieur.");
 }
});
C.addEventListener("pointerup",e=>{
 e.preventDefault(); const p=pointer(e);
 if(phase==="place" && place){
   place=null;phase="ready";
   setMsg("🎯 Maintenant, touche ⚪ et tire-la vers l'intérieur. Relâche pour frapper.");
 }else if(phase==="ready" && aim){
   aim.x=p.x;aim.y=p.y;
   const dx=shooter.x-p.x,dy=shooter.y-p.y,L=Math.hypot(dx,dy);
   aim=null;powerBox.style.display="none";
   if(L<10){setMsg("Tire la bille vers l'intérieur avant de relâcher.");return}
   const power=Math.min(23,Math.max(5,5+L*.085));
   const len=Math.max(L,1);
   shooter.vx=dx/len*power; shooter.vy=dy/len*power;
   shots++;shotId++;combo=0;phase="moving";settleTimer=0;tone(220,.08,"triangle",.05);
   setMsg("💥 Tir #"+shots+" — les collisions sont calculées automatiquement.");
   updateUI();
 }
});
C.addEventListener("pointercancel",()=>{aim=null;place=null;powerBox.style.display="none"});

function collide(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
 if(d===0||d>=min)return false;
 const nx=dx/d,ny=dy/d,over=min-d;
 b.x+=nx*over*.5;b.y+=ny*over*.5;a.x-=nx*over*.5;a.y-=ny*over*.5;
 const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
 if(rv>=0)return true;
 const impulse=-rv*1.28;
 a.vx-=impulse*nx;a.vy-=impulse*ny;
 b.vx+=impulse*nx;b.vy+=impulse*ny;
 return true;
}

function physics(){
 if(phase==="moving"){
   const arr=balls.filter(b=>b.active);
   shooter.x+=shooter.vx;shooter.y+=shooter.vy;
   shooter.vx*=.986;shooter.vy*=.986;

   for(const b of arr){
     b.x+=b.vx;b.y+=b.vy;b.vx*=.992;b.vy*=.992;
   }

   // Shooter -> targets. Multiple collisions are allowed in the same shot.
   for(const b of arr){
     if(collide(shooter,b)){
       combo++; score+=Math.min(5,combo); shake=Math.max(shake,5); burst(b.x,b.y,b.color,7); tone(180+combo*45,.055,"square",.025);
       // extra impulse toward the current shooting direction
       const s=Math.hypot(shooter.vx,shooter.vy)||1;
       b.vx += (shooter.vx/s)*1.5;
       b.vy += (shooter.vy/s)*1.5;
     }
   }
   // Target -> target
   for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)collide(arr[i],arr[j]);

   // A target is won ONLY after its center genuinely crosses the circle boundary.
   for(const b of arr){
     const d=Math.hypot(b.x-cx,b.y-cy);
     if(d>R+b.r*.05){
       b.active=false;won++;score+=10+Math.min(25,combo*5);burst(b.x,b.y,b.color,14);shake=Math.max(shake,8);tone(520+won*30,.09,"sine",.045);
     }else if(d>R-b.r*.72){
       // Soft inward correction, but never trap a fast outward marble.
       const nx=(b.x-cx)/(d||1),ny=(b.y-cy)/(d||1);
       const outward=b.vx*nx+b.vy*ny;
       if(outward<2.0){
         b.x=cx+nx*(R-b.r);
         b.y=cy+ny*(R-b.r);
         b.vx-=outward*nx*1.55;b.vy-=outward*ny*1.55;
       }
     }
   }

   // White marble stays physically outside. If it goes far away, the shot is simply over.
   const sd=Math.hypot(shooter.x-cx,shooter.y-cy);
   const outerMax=Math.max(R+190,Math.min(W,H)*.60);
   if(sd>outerMax){shooter.vx*=.5;shooter.vy*=.5;shooter.x=cx+(shooter.x-cx)/sd*outerMax;shooter.y=cy+(shooter.y-cy)/sd*outerMax}

   updateUI();

   const speed=Math.hypot(shooter.vx,shooter.vy);
   const targetSpeed=arr.reduce((m,b)=>Math.max(m,Math.hypot(b.vx,b.vy)),0);
   if(speed<.10 && targetSpeed<.10) settleTimer++;
   else settleTimer=0;

   if(won===balls.length){finish(true);return}
   if(settleTimer>12){
     // If the shooter has entered the circle and stopped, the player loses.
     if(Math.hypot(shooter.x-cx,shooter.y-cy)<R-shooter.r){
       finish(false,"La bille blanche est restée dans le cercle : tir perdu.");
       return;
     }
     // Reposition ONLY after the shot has naturally ended, outside the circle.
     const ang=Math.atan2(shooter.y-cy,shooter.x-cx);
     placeShooter(ang); phase="place";
     setMsg("Tir terminé. ⚪ Replace la bille autour du cercle pour choisir un nouvel angle.");
   }
 }
}

function finish(win,reason){
 phase="over";if(score>bestScore){bestScore=score;localStorage.setItem("jwetMabBest",String(bestScore));}updateUI();restart.style.display="block";tone(win?880:120,.18,win?"sine":"sawtooth",.06);
 setMsg(win
   ?"🏆 PARTIE TERMINÉE ! Toutes les billes sont sorties. Billes gagnées : "+won+" • Tirs : "+shots+" • Score : "+score
   :"❌ PARTIE TERMINÉE. "+(reason||"Plus aucun tir possible.")+" Billes gagnées : "+won+" • Tirs : "+shots+" • Score : "+score);
}
restart.onclick=newGame;
soundBtn.onclick=()=>{soundOn=!soundOn;localStorage.setItem("jwetMabSound",soundOn?"on":"off");soundBtn.textContent=soundOn?"🔊":"🔇";if(soundOn)tone(660,.06);};

const aboutBtn=document.getElementById("aboutBtn");
const aboutModal=document.getElementById("aboutModal");
const aboutClose=document.getElementById("aboutClose");
const aboutOk=document.getElementById("aboutOk");
function closeAbout(){aboutModal.hidden=true}
aboutBtn.onclick=()=>{aboutModal.hidden=false};
aboutClose.onclick=closeAbout;
aboutOk.onclick=closeAbout;
aboutModal.addEventListener("click",e=>{if(e.target===aboutModal)closeAbout()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAbout()});

function drawBall(b,white=false){
 if(!white&&!b.active)return;
 ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
 const g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,1,b.x,b.y,b.r);
 if(white){g.addColorStop(0,"#fff");g.addColorStop(.65,"#ddd");g.addColorStop(1,"#888")}
 else {g.addColorStop(0,"#fff");g.addColorStop(.18,b.color);g.addColorStop(1,b.color)}
 ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#111";ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save(); if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
 // ground
 ctx.beginPath();ctx.arc(cx,cy,R+5,0,Math.PI*2);ctx.fillStyle="#8b754a";ctx.fill();
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle="#5b8b42";ctx.fill();
 ctx.lineWidth=5;ctx.strokeStyle="#d8c18b";ctx.stroke();

 // aiming guide: drag inward -> opposite vector is firing direction inward
 if(aim){
   const dx=shooter.x-aim.x,dy=shooter.y-aim.y,L=Math.hypot(dx,dy)||1;
   const q=Math.min(150,L*1.8),tx=shooter.x+dx/L*q,ty=shooter.y+dy/L*q;
   ctx.setLineDash([8,7]);ctx.lineWidth=4;ctx.strokeStyle="#ffd400";
   ctx.beginPath();ctx.moveTo(shooter.x,shooter.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
   const a=Math.atan2(dy,dx);
   ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx-Math.cos(a-.5)*18,ty-Math.sin(a-.5)*18);ctx.lineTo(tx-Math.cos(a+.5)*18,ty-Math.sin(a+.5)*18);ctx.closePath();ctx.fillStyle="#ffd400";ctx.fill();
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life+1,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const b of balls)drawBall(b,false);
 drawBall(shooter,true);
 if(phase==="place"){
   ctx.beginPath();ctx.arc(cx,cy,R+shooter.r+28,0,Math.PI*2);ctx.setLineDash([4,8]);ctx.lineWidth=2;ctx.strokeStyle="#fff8";ctx.stroke();ctx.setLineDash([]);
 }
 ctx.restore();
}
function loop(){physics();updateParticles();draw();requestAnimationFrame(loop)}
resize();newGame();loop();
</script>
</body>
</html>
